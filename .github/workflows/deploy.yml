#File name: deploy.yml
#Author: Kyle McColgan
#Date: 29 September 2026
#Description: This file contains the workflow for GitHub Actions and the GitHub Pages deployment processes.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write  # For push to the gh-pages branch...

#Prevents multiple concurrent deployments from stepping on each other...
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci #Safer/faster alternative to npm install in CI environments.

      - name: Build the project
        run: npm run build  # Vite outputs to ./dist directory.

      - name: Execute test cases
        run: npm test

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

