<!doctype html>
<html lang="en">
  <head>
    <!-- Document Setup. -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Application Identity. -->
    <title>Stopwatch</title>
    <meta name="application-name" content="Stopwatch" />
    <meta
      name="description"
      content="A modern, fullscreen stopwatch with an expansive digital display."
    />
    <meta name="format-detection" content="telephone=no" />

    <!-- Initial Theme. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#05070a" />

    <!-- PWA. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Stopwatch" />
    <link rel="apple-touch-icon" href="/images/favicon.png" />

    <!-- Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icons. -->
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />

    <!-- Initialize Theme Before Rendering. -->
    <script>
      (() => {
        const root = document.documentElement;
        const storageKey = "stopwatch-theme";
        const colors = { light: "#f7f9fc", dark: "#05070a" };
        let theme;

        try
        {
          const savedTheme = localStorage.getItem(storageKey);
          if ((savedTheme === "light") || (savedTheme === "dark"))
          {
            theme = savedTheme;
          }
        }
        catch
        {
          //Local storage unavailable.
        }

        if (!theme)
        {
          theme = window.matchMedia?.("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }

        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = colors[theme];
      })();
    </script>

    <!-- Prevent Initial Background Flash. -->
    <style>html { min-height: 100%; background: #05070a; color-scheme: dark; } html[data-theme="light"] { background: #f7f9fc; color-scheme: light; } body { min-width: 320px; margin: 0; }</style>
  </head>
  <body>
    <noscript>
      <div class="noscript-message">
        JavaScript is required to run this application!
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
